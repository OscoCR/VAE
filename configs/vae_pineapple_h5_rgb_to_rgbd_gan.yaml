# -------------------- Training Hyperparameters --------------------
batch_size: 8
lr: 0.0001
epochs: 50
patience: 10

# -------------------- Checkpoints & Output --------------------
checkpoints: "/work/oortega/checkpoints/vae_rgb_to_rgbd_gan/"

# -------------------- Fine-tuning --------------------
pretrained_vae_checkpoint: "/work/oortega/checkpoints/vae_rgb_to_rgbd/betaKL@0.001/best.pt"
adv_weight: 0.01

# -------------------- Dataset & Splits --------------------
dataset_path: "/data/oortega/pineapple_960x544.h5"
train_ratio: 0.8
val_ratio: 0.2
resize_img: 256
augment: False
augment_ratio: 2
use_test_split: True
create_new_split: True
num_folds: 5
seed: 42

# -------------------- VAE Loss --------------------
kl_beta: 0.001

# -------------------- Device / Architecture --------------------
device: "cuda"
in_channels: 3    # encoder sees RGB only
out_channels: 4   # decoder reconstructs RGB + depth (predicts depth purely from the RGB-derived latent)

# -------------------- Reproducibility --------------------
deterministic: True
cudnn_benchmark: False

# -------------------- DataLoader --------------------
num_workers: 4
pin_memory: True
persistent_workers: True

# -------------------- WandB --------------------
wandb_project: "dual_vae"
wandb_entity: "osco-itcr"
